name: page_animator
description: A Flutter package that provides smooth page transitions and animations with customizable effects. Perfect for creating engaging user interfaces with horizontal page navigation.
version: 1.0.0
homepage: https://github.com/StageCoding/page_animator
repository: https://github.com/StageCoding/page_animator.git
issue_tracker: https://github.com/StageCoding/page_animator/issues

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_hooks: ^0.20.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
topics:
  - animation
  - ui
  - page-transition
  - page-animation
  - infinite-scroll

platforms:
  android:
  ios:
  web:
  windows:
  macos:
  linux:
